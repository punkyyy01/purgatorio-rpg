# Purgatorio RPG: ajuste moderado de Sound Physics Remastered (solo cliente).
# Solo se cambian estos valores; el resto los completa el mod con sus valores por defecto.
# Reverberación más suave que la de serie (1.0) para que cuevas y edificios no resulten cargantes.
reverb_gain=0.7
# Los sonidos de ambiente de cueva, Nether y bajo el agua se quedan sin procesar (valor de serie).
evaluate_ambient_sounds=false
